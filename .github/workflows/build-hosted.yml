name: Full build (GitHub-hosted x86_64)

# Runs the complete cross-build on a GitHub-hosted ubuntu-24.04 runner
# (x86_64): download deps -> toolchain -> JBR checkout -> patch -> configure ->
# make images -> jlink package -> upload artifact.
#
# Measured: JBR 25 `make images` is ~24 min on a 2 vCPU aarch64 host
# (PCH disabled); on the 4 vCPU hosted runner the whole job is typically
# 25-40 min including a cold dependency download.  JBR 21 takes longer
# (~1 h on 2 vCPU) but still fits the job timeout.
#
# There is no release step here on purpose: artifacts land in the run page and
# can be attached to a release manually.  Self-hosted arm64 builds stay in
# build-full.yml.

on:
  workflow_dispatch:
    inputs:
      jbr:
        description: "JetBrainsRuntime line to build"
        type: choice
        options: ["21", "25"]
        default: "25"
      jobs:
        description: "Parallel make jobs (JOBS)"
        required: false
        default: "4"

permissions:
  contents: read

concurrency:
  group: build-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JBR_LINE: ${{ inputs.jbr }}
      JOBS: ${{ inputs.jobs }}
      # apt's clang-18 has ld.lld next to the llvm bin dir; the generated
      # wrappers put this on PATH so `-fuse-ld=lld` resolves.
      LLD_BIN: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # The runner starts with ~14 GB free; the JDK build tree alone needs
        # ~2 GB and an unpacked NDK another ~2 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential make autoconf m4 zip unzip file \
            clang-18 lld-18 llvm-18 libclang-18-dev cmake xz-utils git curl
          clang-18 --version | head -1
          autoconf --version | head -1

      - name: Cache NDK / boot JDK / freetype / elf-cleaner
        uses: actions/cache@v6
        with:
          path: |
            work/android-ndk-r27c
            work/jdk-21.0.13+9
            work/jdk-25.0.5+8
            work/freetype-2.10.0
            work/termux-elf-cleaner
            work/bin
            work/android-openjdk-build-multiarch
          key: deps-${{ runner.os }}-jbr${{ inputs.jbr }}-ndk27c-${{ hashFiles('scripts/env.sh') }}
          restore-keys: |
            deps-${{ runner.os }}-jbr${{ inputs.jbr }}-

      - name: Build and package
        run: ./scripts/build.sh --jbr "$JBR_LINE"

      - name: Verify artifact
        run: |
          ls -lh out/*.tar.xz out/SHA256SUMS.txt
          ( cd out && sha256sum -c SHA256SUMS.txt )
          mkdir -p /tmp/jre-check
          tar -xJf out/jre*-jbr-android-arm64-*.tar.xz -C /tmp/jre-check
          file /tmp/jre-check/lib/server/libjvm.so | grep -q 'ARM aarch64'
          grep -E '^(JAVA_VERSION|OS_ARCH)=' /tmp/jre-check/release

      - name: Upload JRE artifact
        uses: actions/upload-artifact@v7
        with:
          name: jre${{ inputs.jbr }}-jbr-android-${{ github.run_number }}
          path: |
            out/jre*-jbr-android-arm64-*.tar.xz
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
